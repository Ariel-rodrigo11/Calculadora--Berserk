<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class = "Calculadora">
	    <div class="display" id="display"></div>
		<div class="buttons">

		    <button class="special button" onclick="limparDisplay()">C</button>

			<button class="special button" onclick="addOperador('%')">%</button>

			<button class="special button" onclick="addOperador('.')">.</button>

			<button class="button op" onclick="addOperador('/')">/</button>

			<button class="button number" onclick="addNumber(7)">7</button>
			<button class="button number" onclick="addNumber(8)">8</button>
			<button class="button number" onclick="addNumber(9)">9</button>

			<button class="button op" onclick="addOperador('*')">*</button>

			<button class="button number" onclick="addNumber(4)">4</button>
			<button class="button number" onclick="addNumber(5)">5</button>
			<button class="button number" onclick="addNumber(6)">6</button>

			<button class="button op" onclick="addOperador('-')">-</button>

			<button class="button number" onclick="addNumber(1)">1</button>
			<button class="button number" onclick="addNumber(2)">2</button>
			<button class="button number" onclick="addNumber(3)">3</button>

			<button class="button op" onclick="addOperador('+')">+</button>

			<button class="button number wide" onclick="addNumber(0)">0</button>

			<button class="button op equal" onclick="calcular()">=</button>
		</div>          
	</div>

	<script src="script.js"></script>
</body>
</html>
